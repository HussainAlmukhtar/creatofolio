name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # --ignore-scripts skips the Klecks build (a separate clone + Parcel
      # build); lint and type-check don't need it.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit
